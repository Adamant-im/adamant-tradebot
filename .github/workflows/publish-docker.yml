name: Publish Docker image

# Runs when a GitHub Release is published (not on every push).
# The job is skipped unless the release tag points to a commit on master.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Verify release tag is on master
        if: github.event_name == 'release'
        run: |
          git fetch origin master
          git merge-base --is-ancestor HEAD origin/master

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
            TAG="${TAG#v}"
          else
            TAG=$(node -p "require('./package.json').version")
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/adamant-im/adamant-tradebot:latest
            ghcr.io/adamant-im/adamant-tradebot:${{ steps.meta.outputs.version }}
          provenance: mode=max

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/adamant-im/adamant-tradebot
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
